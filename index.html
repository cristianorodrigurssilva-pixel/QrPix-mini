<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrPix Multi-Bancos</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=2">

    <!-- Biblioteca QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 20px; 
            max-width: 420px; 
            width: 100%; 
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.12); 
            border: 1px solid #bfdbfe;
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 { 
            font-size: 32px; 
            font-weight: 800; 
            color: #1e3a8a; 
            letter-spacing: 0.5px;
        }
        .pix-color { color: #06b6d4; }

        .seletor-banco-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .seletor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .seletor-label {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
        }

        .btn-gerenciar {
            background: none;
            border: none;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        select.select-perfil {
            width: 100%;
            padding: 10px;
            border: 2px solid #bfdbfe;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #1e3a8a;
            background: #ffffff;
            margin-top: 0;
        }

        label { font-size: 14px; font-weight: 700; color: #1e3a8a; display: block; margin-top: 14px; }
        
        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-top: 6px; 
            border: 2px solid #bfdbfe; 
            border-radius: 10px; 
            font-size: 16px; 
            background: #f8fafc; 
            color: #1e293b;
        }
        
        .input-valor {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #2563eb;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            cursor: pointer;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin-top: 0;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 13px;
            font-weight: 600;
            color: #1e3a8a;
            margin-top: 0;
        }

        button.btn-principal { 
            width: 100%; 
            padding: 14px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            margin-top: 16px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button.btn-principal:hover { background-color: #1d4ed8; }
        
        .btn-whatsapp { background-color: #25d366 !important; color: white; margin-top: 10px; }
        .btn-whatsapp:hover { background-color: #1eb954 !important; }
        
        #qrcode-container { 
            margin-top: 20px; 
            display: flex; 
            justify-content: center; 
            background: #ffffff; 
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed #38bdf8;
        }
        
        .result-box { display: none; margin-top: 15px; }
        
        textarea { 
            width: 100%; 
            height: 75px; 
            margin-top: 8px; 
            padding: 10px; 
            border-radius: 10px; 
            border: 2px solid #bfdbfe; 
            font-family: monospace; 
            font-size: 11px; 
            resize: none; 
            background: #f8fafc; 
            color: #1e3a8a;
        }

        .config-box {
            display: none;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
        }

        .lista-perfis {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .item-perfil {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 6px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .item-acoes {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-star {
            background: #fef08a;
            color: #854d0e;
            border: 1px solid #fde047;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            line-height: 1;
        }
        .btn-star.active {
            background: #eab308;
            color: white;
            border-color: #ca8a04;
        }

        .btn-del {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            width: auto;
            margin-top: 0;
        }

        .toast {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #06b6d4;
            color: #0f172a;
            padding: 14px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            z-index: 9999;
        }
        .toast.show { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Qr<span class="pix-color">Pix</span></h1>
    </div>

    <!-- Aba de Seleção de Instituição -->
    <div class="seletor-banco-box">
        <div class="seletor-header">
            <span class="seletor-label">Instituição / Chave</span>
            <button type="button" class="btn-gerenciar" onclick="toggleConfig()" id="btn-gerenciar-texto">⚙️ Gerenciar</button>
        </div>
        <select id="seletorPerfil" class="select-perfil" onchange="selecionarPerfil()">
            <!-- Perfis cadastrados serão inseridos aqui -->
        </select>
    </div>

    <!-- Painel para Cadastrar/Editar Instituições -->
    <div id="config-box" class="config-box">
        <h4 style="color: #1e3a8a; margin-bottom: 10px;">Cadastrar Nova Instituição:</h4>
        
        <label for="nomeBanco" style="margin-top:0;">Nome da Instituição/Banco:</label>
        <input type="text" id="nomeBanco" placeholder="Ex: Nubank, Itaú, C6">

        <label for="tipoChave">Tipo de Chave:</label>
        <select id="tipoChave" onchange="alterarTipoChave()">
            <option value="CELULAR">Celular</option>
            <option value="CPF">CPF</option>
            <option value="CNPJ">CNPJ</option>
            <option value="EMAIL">E-mail</option>
            <option value="EVP">Chave Aleatória (EVP)</option>
        </select>

        <label for="chave" id="labelChave">Chave Pix:</label>
        <input type="text" id="chave" placeholder="(00) 00000-0000">

        <label for="nome">Nome do Recebedor:</label>
        <input type="text" id="nome" placeholder="Seu Nome">

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Sua Cidade">

        <div class="checkbox-container">
            <input type="checkbox" id="chkPrincipal">
            <label for="chkPrincipal" class="checkbox-label">Tornar esta instituição principal</label>
        </div>

        <button type="button" class="btn-principal" onclick="adicionarPerfil()" style="background-color: #0f172a; margin-top: 14px;">Adicionar Instituição</button>

        <div id="listaPerfisContainer" class="lista-perfis"></div>
    </div>

    <!-- Tela Principal -->
    <label for="valor">Digite o Valor (R$):</label>
    <input type="text" id="valor" class="input-valor" placeholder="0,00" inputmode="numeric" autofocus>

    <button type="button" class="btn-principal" onclick="gerarPix()">Gerar PIX</button>

    <div id="result" class="result-box">
        <div id="qrcode-container"></div>
        
        <label for="pix-payload">Código Pix Copia e Cola:</label>
        <textarea id="pix-payload" readonly></textarea>
        
        <button type="button" id="btn-copiar" class="btn-principal" onclick="copiarPix()">Copiar Código Pix</button>
        <button type="button" class="btn-principal btn-whatsapp" onclick="enviarWhatsAppComBotaoCopia()">Enviar por WhatsApp</button>
    </div>
</div>

<div id="toast" class="toast">✓ Código Pix copiado!</div>

<script>
let perfis = [];
let perfilAtualIndex = 0;

function carregarPerfis() {
    const salvos = localStorage.getItem('qrpix_perfis_multibanco');
    if (salvos) {
        try { perfis = JSON.parse(salvos); } catch (e) { perfis = []; }
    }

    if (perfis.length === 0) {
        perfis = [{
            banco: "Minha Chave Principal",
            tipo: "CELULAR",
            chave: "",
            nome: "",
            cidade: "",
            isPrincipal: true
        }];
        document.getElementById('config-box').style.display = 'block';
    }

    const principalIdx = perfis.findIndex(p => p.isPrincipal);
    perfilAtualIndex = principalIdx !== -1 ? principalIdx : 0;

    atualizarSelectPerfis();
    renderizarListaExclusao();
}

function salvarPerfis() {
    localStorage.setItem('qrpix_perfis_multibanco', JSON.stringify(perfis));
    atualizarSelectPerfis();
    renderizarListaExclusao();
}

function atualizarSelectPerfis() {
    const select = document.getElementById('seletorPerfil');
    select.innerHTML = '';

    perfis.forEach((p, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        const sufixo = p.isPrincipal ? ' ⭐' : '';
        opt.innerText = `${p.banco} - ${p.tipo}${sufixo}`;
        select.appendChild(opt);
    });

    select.value = perfilAtualIndex;
}

function selecionarPerfil() {
    const select = document.getElementById('seletorPerfil');
    perfilAtualIndex = parseInt(select.value, 10);
}

function definirComoPrincipal(index) {
    perfis.forEach((p, i) => {
        p.isPrincipal = (i === index);
    });
    perfilAtualIndex = index;
    salvarPerfis();
}

function toggleConfig() {
    const box = document.getElementById('config-box');
    const btn = document.getElementById('btn-gerenciar-texto');
    
    if (box.style.display === 'block') {
        box.style.display = 'none';
        btn.innerText = '⚙️ Gerenciar';
    } else {
        box.style.display = 'block';
        btn.innerText = 'Fechar';
    }
}

function adicionarPerfil() {
    let banco = document.getElementById('nomeBanco').value.trim();
    let tipo = document.getElementById('tipoChave').value;
    let chave = document.getElementById('chave').value.trim();
    let nome = document.getElementById('nome').value.trim();
    let cidade = document.getElementById('cidade').value.trim();
    let querSerPrincipal = document.getElementById('chkPrincipal').checked;

    if (!banco || !chave || !nome || !cidade) {
        alert('Por favor, preencha todos os campos da instituição.');
        return;
    }

    const eOPrimeiro = perfis.length === 1 && !perfis[0].chave;
    if (eOPrimeiro) {
        perfis = [];
    }

    const isPrincipal = querSerPrincipal || eOPrimeiro || perfis.length === 0;

    if (isPrincipal) {
        perfis.forEach(p => p.isPrincipal = false);
    }

    const novoPerfil = { 
        banco, 
        tipo, 
        chave, 
        nome, 
        cidade, 
        isPrincipal
    };

    perfis.push(novoPerfil);
    perfilAtualIndex = perfis.length - 1;
    salvarPerfis();

    document.getElementById('nomeBanco').value = '';
    document.getElementById('chave').value = '';
    document.getElementById('chkPrincipal').checked = false;
    
    document.getElementById('config-box').style.display = 'none';
    document.getElementById('btn-gerenciar-texto').innerText = '⚙️ Gerenciar';
}

function removerPerfil(index) {
    if (perfis.length <= 1) {
        alert('Você precisa ter pelo menos uma instituição cadastrada.');
        return;
    }
    
    const eraPrincipal = perfis[index].isPrincipal;
    perfis.splice(index, 1);
    
    if (eraPrincipal && perfis.length > 0) {
        perfis[0].isPrincipal = true;
    }

    if (perfilAtualIndex >= perfis.length) perfilAtualIndex = 0;
    salvarPerfis();
}

function renderizarListaExclusao() {
    const container = document.getElementById('listaPerfisContainer');
    container.innerHTML = '<h5 style="margin-top:10px; color:#1e3a8a;">Instituições Salvas:</h5>';

    perfis.forEach((p, index) => {
        if (!p.banco && !p.chave) return;

        const item = document.createElement('div');
        item.className = 'item-perfil';
        
        const isStar = p.isPrincipal ? 'btn-star active' : 'btn-star';
        const txtStar = p.isPrincipal ? '★' : '☆';
        const titleStar = p.isPrincipal ? 'Instituição Principal' : 'Tornar Principal';

        item.innerHTML = `
            <span><strong>${p.banco}</strong> (${p.chave})</span>
            <div class="item-acoes">
                <button type="button" class="${isStar}" onclick="definirComoPrincipal(${index})" title="${titleStar}">${txtStar}</button>
                <button type="button" class="btn-del" onclick="removerPerfil(${index})">Excluir</button>
            </div>
        `;
        container.appendChild(item);
    });
}

function alterarTipoChave() {
    const tipo = document.getElementById('tipoChave').value;
    const label = document.getElementById('labelChave');
    const input = document.getElementById('chave');

    if (tipo === 'CELULAR') {
        label.innerText = 'Chave Pix (DDD + Número):';
        input.placeholder = '(00) 00000-0000';
    } else if (tipo === 'CPF') {
        label.innerText = 'Chave Pix (CPF):';
        input.placeholder = '000.000.000-00';
    } else if (tipo === 'CNPJ') {
        label.innerText = 'Chave Pix (CNPJ):';
        input.placeholder = '00.000.000/0001-00';
    } else if (tipo === 'EMAIL') {
        label.innerText = 'Chave Pix (E-mail):';
        input.placeholder = 'seuemail@exemplo.com';
    } else if (tipo === 'EVP') {
        label.innerText = 'Chave Aleatória (EVP):';
        input.placeholder = '00000000-0000-0000-0000-000000000000';
    }
}

// Lógica de Formatação e QR Code
function CRC16(str) {
    let crc = 0xFFFF;
    const encoder = new TextEncoder();
    const bytes = encoder.encode(str);
    for (let c = 0; c < bytes.length; c++) {
        crc ^= bytes[c] << 8;
        for (let i = 0; i < 8; i++) {
            if ((crc & 0x8000) !== 0) {
                crc = (crc << 1) ^ 0x1021;
            } else {
                crc = crc << 1;
            }
        }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function formatField(id, value) {
    const encoder = new TextEncoder();
    const len = encoder.encode(value).length.toString().padStart(2, '0');
    return id + len + value;
}

function limparTexto(texto) {
    if (!texto) return '';
    let t = texto.replace(/&/g, 'E');
    t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    t = t.replace(/[^a-zA-Z0-9 ]/g, "");
    return t.trim().toUpperCase();
}

function tratarChavePixPorTipo(chaveBruta, tipo) {
    if (!chaveBruta) return '';
    let c = chaveBruta.trim();
    if (tipo === 'EMAIL' || tipo === 'EVP') return c.toLowerCase().trim();
    let apenasNumeros = c.replace(/\D/g, '');
    if (tipo === 'CPF' || tipo === 'CNPJ') return apenasNumeros;
    if (tipo === 'CELULAR') {
        if (c.startsWith('+55')) return '+55' + apenasNumeros.substring(2);
        if ((apenasNumeros.length === 12 || apenasNumeros.length === 13) && apenasNumeros.startsWith('55')) {
            return '+' + apenasNumeros;
        }
        return '+55' + apenasNumeros;
    }
    return c;
}

function gerarPix() {
    const perfil = perfis[perfilAtualIndex];
    if (!perfil || !perfil.chave) {
        alert('Selecione ou cadastre uma instituição válida.');
        document.getElementById('config-box').style.display = 'block';
        return;
    }

    let chave = tratarChavePixPorTipo(perfil.chave, perfil.tipo);
    let nome = limparTexto(perfil.nome).substring(0, 25);
    let cidade = limparTexto(perfil.cidade).substring(0, 15);
    let valorInput = document.getElementById('valor').value;

    let payload = formatField('00', '01') + formatField('01', '12');
    let merchantAccount = formatField('00', 'BR.GOV.BCB.PIX') + formatField('01', chave);
    payload += formatField('26', merchantAccount);
    payload += formatField('52', '0000') + formatField('53', '986');

    if (valorInput) {
        let valorTratado = valorInput.replace(/\./g, '').replace(',', '.').trim();
        let valorNum = parseFloat(valorTratado);
        if (!isNaN(valorNum) && valorNum > 0) {
            payload += formatField('54', valorNum.toFixed(2));
        }
    }

    payload += formatField('58', 'BR') + formatField('59', nome) + formatField('60', cidade);
    payload += formatField('62', formatField('05', '***')) + '6304';

    const crc = CRC16(payload);
    const pixCompleto = payload + crc;

    document.getElementById('pix-payload').value = pixCompleto;
    document.getElementById('qrcode-container').innerHTML = '';

    new QRCode(document.getElementById('qrcode-container'), { 
        text: pixCompleto, 
        width: 180, 
        height: 180,
        correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('result').style.display = 'block';
}

function mostrarAviso() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function copiarPix() {
    const payloadInput = document.getElementById('pix-payload');
    if (!payloadInput.value) return;
    payloadInput.select();
    document.execCommand('copy');
    mostrarAviso();
}

function enviarWhatsAppComBotaoCopia() {
    const pixCode = document.getElementById('pix-payload').value.trim();
    if (!pixCode) return;

    const perfil = perfis[perfilAtualIndex];
    const valor = document.getElementById('valor').value || '0,00';
    const banco = perfil ? perfil.banco : 'Pix';
    const nome = perfil ? perfil.nome : '';

    // Formatação em bloco de código monoespaçado (3 crases)
    // O WhatsApp exibe automaticamente um botão nativo "Copiar código" para quem recebe esta mensagem.
    let mensagem = `*Cobrança Pix - ${banco}*\n`;
    if (nome) mensagem += `*Recebedor:* ${nome}\n`;
    mensagem += `*Valor:* R$ ${valor}\n\n`;
    mensagem += `\`\`\`${pixCode}\`\`\``;

    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
    window.open(url, '_blank');
}

document.addEventListener('DOMContentLoaded', carregarPerfis);

document.getElementById('valor').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (!value) { e.target.value = ''; return; }
    e.target.value = (parseInt(value, 10) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
});
</script>

</body>
</html>
