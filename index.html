<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrPix - Gerador de Pix</title>
    <style>
        :root {
            --primary: #00b493;
            --primary-hover: #00967a;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: none;
            height: 90px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: #ffffff;
        }

        .btn-whatsapp:hover {
            background-color: #1ebd56;
        }

        .aviso {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f8f5;
            color: #00796b;
            border: 1px solid #a3e4d7;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QrPix Payload Generator</h1>

    <div class="form-group">
        <label for="nome">Nome do Recebedor:</label>
        <input type="text" id="nome" placeholder="Ex: João da Silva">
    </div>

    <div class="form-group">
        <label for="valor">Valor (R$):</label>
        <input type="text" id="valor" placeholder="0,00">
    </div>

    <div class="form-group">
        <label for="pix-payload">Payload Pix (Copia e Cola):</label>
        <textarea id="pix-payload" placeholder="00020126..."></textarea>
    </div>

    <button type="button" class="btn btn-whatsapp" onclick="enviarWhatsApp()">
        Enviar por WhatsApp
    </button>

    <div id="aviso" class="aviso"></div>
</div>

<script>
/**
 * QrPix - Módulo de Envio Otimizado para WhatsApp & WhatsApp Business
 */

/**
 * Exibe mensagens de feedback temporárias na tela
 */
function mostrarAviso(mensagem) {
    const elAviso = document.getElementById('aviso');
    if (elAviso) {
        elAviso.innerText = mensagem;
        elAviso.style.display = 'block';
        setTimeout(() => {
            elAviso.style.display = 'none';
        }, 4000);
    }
}

/**
 * Função principal disparada pelo botão "Enviar por WhatsApp"
 */
async function enviarWhatsApp() {
    // 1. Obtenção e Higienização do Payload do Pix
    const pixInput = document.getElementById('pix-payload');
    const pixCode = pixInput ? pixInput.value.trim() : '';

    if (!pixCode) {
        mostrarAviso('⚠️ Gere ou insira o código Pix antes de enviar!');
        return;
    }

    // 2. Execução da Cópia Silenciosa ("Clipboard First")
    const copiadoComSucesso = await copiarParaClipboard(pixCode, pixInput);
    
    if (copiadoComSucesso) {
        mostrarAviso('✓ Código Pix copiado! Abrindo WhatsApp...');
    }

    // 3. Obtenção das Informações da Cobrança
    const nome = obterNomeRecebedor();
    const valor = obterValorCobranca();

    // 4. Montagem da Mensagem Estruturada
    // O uso de \n\n\n cria o espaçamento isolado exigido pelo parser do WhatsApp Business
    const mensagemTexto = 
        `💠 *DADOS PARA PAGAMENTO VIA PIX*\n\n` +
        `👤 *Recebedor:* ${nome}\n` +
        `💵 *Valor:* R$ ${valor}\n\n` +
        `👇 *CÓDIGO PIX COPIA E COLA:*\n\n\n` +
        `${pixCode}`;

    // 5. Construção da URL Universal via URLSearchParams
    const urlFinal = construirUrlWhatsApp(mensagemTexto);

    // 6. Redirecionamento com atraso de segurança para conclusão do Clipboard
    setTimeout(() => {
        window.location.href = urlFinal;
    }, 150);
}

/**
 * Garante a cópia do texto para a área de transferência usando Clipboard API ou Fallback
 */
async function copiarParaClipboard(texto, inputElement) {
    // Tentativa 1: API Contemporânea do Navegador (Assíncrona)
    if (navigator.clipboard && window.isSecureContext) {
        try {
            await navigator.clipboard.writeText(texto);
            return true;
        } catch (err) {
            console.warn('Clipboard API falhou, acionando fallback...', err);
        }
    }

    // Tentativa 2: Fallback Clássico para Navegadores Legados/WebViews
    try {
        const textAreaAuxiliar = document.createElement('textarea');
        textAreaAuxiliar.value = texto;
        textAreaAuxiliar.style.position = 'fixed';
        textAreaAuxiliar.style.left = '-999999px';
        textAreaAuxiliar.style.top = '-999999px';
        document.body.appendChild(textAreaAuxiliar);
        
        textAreaAuxiliar.focus();
        textAreaAuxiliar.select();
        
        const resultadoExecucao = document.execCommand('copy');
        document.body.removeChild(textAreaAuxiliar);
        
        return resultadoExecucao;
    } catch (err) {
        console.error('Falha na execução da cópia:', err);
        return false;
    }
}

/**
 * Monta a URL de redirecionamento utilizando URLSearchParams
 */
function construirUrlWhatsApp(textoMensagem) {
    const parametros = new URLSearchParams();
    parametros.append('text', textoMensagem);
    return `https://api.whatsapp.com/send?${parametros.toString()}`;
}

/**
 * Auxiliar para recuperar o nome do recebedor
 */
function obterNomeRecebedor() {
    return localStorage.getItem('pix_perm_nome') || 
           (document.getElementById('nome') ? document.getElementById('nome').value : '') || 
           'Recebedor';
}

/**
 * Auxiliar para recuperar o valor da cobrança
 */
function obterValorCobranca() {
    return (document.getElementById('valor') ? document.getElementById('valor').value : '') || '0,00';
}
</script>

</body>
</html>
