<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Pix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #25d366;
            color: white;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gerador de Pagamento Pix</h2>
    
    <div class="form-group">
        <label for="nome">Nome do Recebedor</label>
        <input type="text" id="nome" placeholder="Digite o nome">
    </div>

    <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input type="text" id="valor" placeholder="0,00">
    </div>

    <div class="form-group">
        <label for="pix-payload">Código Pix Copia e Cola</label>
        <input type="text" id="pix-payload" placeholder="Cole o código Pix aqui">
    </div>

    <button onclick="enviarWhatsApp()">Enviar via WhatsApp</button>
</div>

<script>
    function enviarWhatsApp() {
        const pixCode = document.getElementById('pix-payload').value.trim();
        if (!pixCode) return;

        const nome = localStorage.getItem('pix_perm_nome') || document.getElementById('nome').value;
        const valor = document.getElementById('valor').value || '0,00';

        let mensagem = `💠 *Dados para Pagamento via PIX*\n\n`;
        if (nome) mensagem += `👤 *Recebedor:* ${nome}\n`;
        mensagem += `💵 *Valor:* R$ ${valor}\n\n`;
        mensagem += `👇 *Código Pix Copia e Cola 📋:*\n\n`;
        mensagem += `${pixCode}`;

        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
