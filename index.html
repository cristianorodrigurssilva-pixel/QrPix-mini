<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrPix Mini</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=2">

    <!-- Biblioteca QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        
        .container { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 20px; 
            max-width: 420px; 
            width: 100%; 
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.12); 
            border: 1px solid #bfdbfe;
            position: relative;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 { 
            font-size: 32px; 
            font-weight: 800; 
            color: #1e3a8a; 
            letter-spacing: 0.5px;
        }
        .pix-color { color: #06b6d4; }

        /* Aba de Seleção de Instituição */
        .seletor-banco-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .seletor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .seletor-label {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
        }

        .btn-gerenciar {
            background: none;
            border: none;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        select.select-perfil {
            width: 100%;
            padding: 10px;
            border: 2px solid #bfdbfe;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #1e3a8a;
            background: #ffffff;
            margin-top: 0;
        }

        label { font-size: 14px; font-weight: 700; color: #1e3a8a; display: block; margin-top: 14px; }
        
        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-top: 6px; 
            border: 2px solid #bfdbfe; 
            border-radius: 10px; 
            font-size: 16px; 
            background: #f8fafc; 
            color: #1e293b;
        }
        
        .input-valor {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #2563eb;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            cursor: pointer;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin-top: 0;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 13px;
            font-weight: 600;
            color: #1e3a8a;
            margin-top: 0;
        }

        button.btn-principal { 
            width: 100%; 
            padding: 14px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            margin-top: 16px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button.btn-principal:hover { background-color: #1d4ed8; }
        
        .btn-whatsapp { background-color: #25d366 !important; color: white; margin-top: 10px; }
        .btn-whatsapp:hover { background-color: #1eb954 !important; }
        
        #qrcode-container { 
            margin-top: 20px; 
            display: flex; 
            justify-content: center; 
            background: #ffffff; 
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed #38bdf8;
        }
        
        .result-box { display: none; margin-top: 15px; }
        
        textarea { 
            width: 100%; 
            height: 75px; 
            margin-top: 8px; 
            padding: 10px; 
            border-radius: 10px; 
            border: 2px solid #bfdbfe; 
            font-family: monospace; 
            font-size: 11px; 
            resize: none; 
            background: #f8fafc; 
            color: #1e3a8a;
        }

        .config-box {
            display: none;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
        }

        .lista-perfis {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .item-perfil {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 6px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .item-acoes {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-star {
            background: #fef08a;
            color: #854d0e;
            border: 1px solid #fde047;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            line-height: 1;
        }
        .btn-star.active {
            background: #eab308;
            color: white;
            border-color: #ca8a04;
        }

        .btn-del {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            width: auto;
            margin-top: 0;
        }

        .toast {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #06b6d4;
            color: #0f172a;
            padding: 14px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            z-index: 9999;
        }
        .toast.show { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Qr<span class="pix-color">Pix Mini</span></h1>
    </div>

    <!-- Aba de Seleção de Instituição / Chave -->
    <div class="seletor-banco-box">
        <div class="seletor-header">
            <span class="seletor-label">Instituição / Chave</span>
            <button type="button" class="btn-gerenciar" onclick="toggleConfig()" id="btn-gerenciar-texto">⚙️ Gerenciar</button>
        </div>
        <select id="seletorPerfil" class="select-perfil" onchange="selecionarPerfil()">
            <!-- Chaves cadastradas serão inseridas aqui -->
        </select>
    </div>

    <!-- Painel de Gerenciamento do QrPix Mini -->
    <div id="config-box" class="config-box">
        <h4 style="color: #1e3a8a; margin-bottom: 8px;">Dados do Recebedor (Fixo):</h4>
        
        <label for="nome" style="margin-top:0;">Nome Completo:</label>
        <input type="text" id="nome" placeholder="Seu Nome">

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Sua Cidade">
        
        <button type="button" class="btn-principal" onclick="salvarDadosFixos()" style="background-color: #0f172a; margin-top: 10px; padding: 10px;">Salvar Dados Fixos</button>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #cbd5e1;">

        <h4 style="color: #1e3a8a; margin-bottom: 8px;">Adicionar Chave Pix:</h4>

        <label for="nomeBanco" style="margin-top:0;">Nome do Banco/Instituição:</label>
        <input type="text" id="nomeBanco" placeholder="Ex: Nubank, Itaú">

        <label for="chave">Chave Pix:</label>
        <input type="text" id="chave" placeholder="CPF, Celular, E-mail ou EVP">

        <div class="checkbox-container">
            <input type="checkbox" id="chkPrincipal">
            <label for="chkPrincipal" class="checkbox-label">Tornar esta instituição principal</label>
        </div>

        <button type="button" class="btn-principal" onclick="adicionarChave()" style="background-color: #2563eb; margin-top: 14px;">Adicionar Chave</button>

        <div id="listaPerfisContainer" class="lista-perfis"></div>
    </div>

    <!-- Tela Principal do Mini (Apenas Valor e Ações) -->
    <label for="valor">Digite o Valor (R$):</label>
    <input type="text" id="valor" class="input-valor" placeholder="0,00" inputmode="numeric" autofocus>

    <button type="button" class="btn-principal" onclick="gerarPix()">Gerar PIX</button>

    <div id="result" class="result-box">
        <div id="qrcode-container"></div>
        
        <label for="pix-payload">Código Pix Copia e Cola:</label>
        <textarea id="pix-payload" readonly></textarea>
        
        <button type="button" id="btn-copiar" class="btn-principal" onclick="copiarPix()">Copiar Código Pix</button>
        <button type="button" class="btn-principal btn-whatsapp" onclick="enviarWhatsAppComBotaoCopia()">Enviar por WhatsApp</button>
    </div>
</div>

<div id="toast" class="toast">✓ Código Pix copiado!</div>

<script>
// Estrutura Mini: Dados fixos + Lista de chaves
let dadosFixos = { nome: "", cidade: "" };
let chaves = [];
let chaveAtualIndex = 0;

// Soliçitação de Armazenamento Permanente (Proteção contra limpeza do SO)
if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist();
}

// Redundância Dupla: LocalStorage + IndexedDB
function carregarTudo() {
    const fixosSalvos = localStorage.getItem('qrpix_mini_fixos');
    if (fixosSalvos) {
        try { dadosFixos = JSON.parse(fixosSalvos); } catch(e){}
    }
    
    const chavesSalvas = localStorage.getItem('qrpix_mini_chaves');
    if (chavesSalvas) {
        try { chaves = JSON.parse(chavesSalvas); } catch(e){}
    }

    // Preenche os campos fixos
    document.getElementById('nome').value = dadosFixos.nome || '';
    document.getElementById('cidade').value = dadosFixos.cidade || '';

    if (chaves.length === 0) {
        document.getElementById('config-box').style.display = 'block';
    }

    const principalIdx = chaves.findIndex(c => c.isPrincipal);
    chaveAtualIndex = principalIdx !== -1 ? principalIdx : 0;

    atualizarSelectChaves();
    renderizarLista();
}

function salvarTudo() {
    localStorage.setItem('qrpix_mini_fixos', JSON.stringify(dadosFixos));
    localStorage.setItem('qrpix_mini_chaves', JSON.stringify(chaves));
    atualizarSelectChaves();
    renderizarLista();
}

function salvarDadosFixos() {
    dadosFixos.nome = document.getElementById('nome').value.trim();
    dadosFixos.cidade = document.getElementById('cidade').value.trim();
    salvarTudo();
    mostrarAviso("✓ Dados fixos salvos!");
}

function atualizarSelectChaves() {
    const select = document.getElementById('seletorPerfil');
    select.innerHTML = '';

    chaves.forEach((c, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        const sufixo = c.isPrincipal ? ' ⭐' : '';
        opt.innerText = `${c.banco}${sufixo}`;
        select.appendChild(opt);
    });

    select.value = chaveAtualIndex;
}

function selecionarPerfil() {
    const select = document.getElementById('seletorPerfil');
    chaveAtualIndex = parseInt(select.value, 10);
}

function definirComoPrincipal(index) {
    chaves.forEach((c, i) => {
        c.isPrincipal = (i === index);
    });
    chaveAtualIndex = index;
    salvarTudo();
}

function toggleConfig() {
    const box = document.getElementById('config-box');
    const btn = document.getElementById('btn-gerenciar-texto');
    
    if (box.style.display === 'block') {
        box.style.display = 'none';
        btn.innerText = '⚙️ Gerenciar';
    } else {
        box.style.display = 'block';
        btn.innerText = 'Fechar';
    }
}

function adicionarChave() {
    let banco = document.getElementById('nomeBanco').value.trim();
    let chave = document.getElementById('chave').value.trim();
    let querSerPrincipal = document.getElementById('chkPrincipal').checked;

    if (!banco || !chave) {
        alert('Preencha o Nome do Banco e a Chave Pix.');
        return;
    }

    salvarDadosFixos();

    const isPrincipal = querSerPrincipal || chaves.length === 0;

    if (isPrincipal) {
        chaves.forEach(c => c.isPrincipal = false);
    }

    chaves.push({ banco, chave, isPrincipal });
    chaveAtualIndex = chaves.length - 1;
    salvarTudo();

    document.getElementById('nomeBanco').value = '';
    document.getElementById('chave').value = '';
    document.getElementById('chkPrincipal').checked = false;
    
    document.getElementById('config-box').style.display = 'none';
    document.getElementById('btn-gerenciar-texto').innerText = '⚙️ Gerenciar';
}

function removerChave(index) {
    if (chaves.length <= 1) {
        alert('Mantenha pelo menos uma chave cadastrada.');
        return;
    }
    
    const eraPrincipal = chaves[index].isPrincipal;
    chaves.splice(index, 1);
    
    if (eraPrincipal && chaves.length > 0) {
        chaves[0].isPrincipal = true;
    }

    if (chaveAtualIndex >= chaves.length) chaveAtualIndex = 0;
    salvarTudo();
}

function renderizarLista() {
    const container = document.getElementById('listaPerfisContainer');
    container.innerHTML = '<h5 style="margin-top:10px; color:#1e3a8a;">Chaves Cadastradas:</h5>';

    chaves.forEach((c, index) => {
        const item = document.createElement('div');
        item.className = 'item-perfil';
        
        const isStar = c.isPrincipal ? 'btn-star active' : 'btn-star';
        const txtStar = c.isPrincipal ? '★' : '☆';
        const titleStar = c.isPrincipal ? 'Chave Principal' : 'Tornar Principal';

        item.innerHTML = `
            <span><strong>${c.banco}</strong> (${c.chave})</span>
            <div class="item-acoes">
                <button type="button" class="${isStar}" onclick="definirComoPrincipal(${index})" title="${titleStar}">${txtStar}</button>
                <button type="button" class="btn-del" onclick="removerChave(${index})">Excluir</button>
            </div>
        `;
        container.appendChild(item);
    });
}

// Tratamento dinâmico de Chave
function tratarChaveBruta(chaveBruta) {
    if (!chaveBruta) return '';
    let c = chaveBruta.trim();
    if (c.includes('@') || c.length > 25) return c.toLowerCase(); // Email ou EVP
    let apenasNumeros = c.replace(/\D/g, '');
    if (apenasNumeros.length === 11 && !c.startsWith('+')) return apenasNumeros; // CPF ou Celular simples
    if (apenasNumeros.length === 14) return apenasNumeros; // CNPJ
    if (c.startsWith('+55')) return '+55' + apenasNumeros.substring(2);
    if ((apenasNumeros.length === 12 || apenasNumeros.length === 13) && apenasNumeros.startsWith('55')) {
        return '+' + apenasNumeros;
    }
    return c;
}

// Lógica de Formatação BACEN / CRC16
function CRC16(str) {
    let crc = 0xFFFF;
    const encoder = new TextEncoder();
    const bytes = encoder.encode(str);
    for (let c = 0; c < bytes.length; c++) {
        crc ^= bytes[c] << 8;
        for (let i = 0; i < 8; i++) {
            if ((crc & 0x8000) !== 0) {
                crc = (crc << 1) ^ 0x1021;
            } else {
                crc = crc << 1;
            }
        }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function formatField(id, value) {
    const encoder = new TextEncoder();
    const len = encoder.encode(value).length.toString().padStart(2, '0');
    return id + len + value;
}

function limparTexto(texto) {
    if (!texto) return '';
    let t = texto.replace(/&/g, 'E');
    t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    t = t.replace(/[^a-zA-Z0-9 ]/g, "");
    return t.trim().toUpperCase();
}

function gerarPix() {
    const itemChave = chaves[chaveAtualIndex];
    if (!itemChave || !itemChave.chave) {
        alert('Cadastre ou selecione uma chave válida.');
        document.getElementById('config-box').style.display = 'block';
        return;
    }

    let chave = tratarChaveBruta(itemChave.chave);
    let nome = limparTexto(dadosFixos.nome).substring(0, 25) || 'RECEBEDOR';
    let cidade = limparTexto(dadosFixos.cidade).substring(0, 15) || 'BRASIL';
    let valorInput = document.getElementById('valor').value;

    let payload = formatField('00', '01') + formatField('01', '12');
    let merchantAccount = formatField('00', 'BR.GOV.BCB.PIX') + formatField('01', chave);
    payload += formatField('26', merchantAccount);
    payload += formatField('52', '0000') + formatField('53', '986');

    if (valorInput) {
        let valorTratado = valorInput.replace(/\./g, '').replace(',', '.').trim();
        let valorNum = parseFloat(valorTratado);
        if (!isNaN(valorNum) && valorNum > 0) {
            payload += formatField('54', valorNum.toFixed(2));
        }
    }

    payload += formatField('58', 'BR') + formatField('59', nome) + formatField('60', cidade);
    payload += formatField('62', formatField('05', '***')) + '6304';

    const crc = CRC16(payload);
    const pixCompleto = payload + crc;

    document.getElementById('pix-payload').value = pixCompleto;
    document.getElementById('qrcode-container').innerHTML = '';

    new QRCode(document.getElementById('qrcode-container'), { 
        text: pixCompleto, 
        width: 180, 
        height: 180,
        correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('result').style.display = 'block';
}

function mostrarAviso(textoMsg) {
    const toast = document.getElementById('toast');
    if (textoMsg) toast.innerText = textoMsg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
}

function copiarPix() {
    const payloadInput = document.getElementById('pix-payload');
    if (!payloadInput.value) return;
    payloadInput.select();
    document.execCommand('copy');
    mostrarAviso("✓ Código Pix copiado!");
}

function enviarWhatsAppComBotaoCopia() {
    const pixCode = document.getElementById('pix-payload').value.trim();
    if (!pixCode) return;

    const itemChave = chaves[chaveAtualIndex];
    const valor = document.getElementById('valor').value || '0,00';
    const banco = itemChave ? itemChave.banco : 'Pix';
    const nome = dadosFixos.nome || '';

    // Formatação em bloco de código monoespaçado (3 crases) para gerar o botão "Copiar código" no WhatsApp
    let mensagem = `*Cobrança Pix - ${banco}*\n`;
    if (nome) mensagem += `*Recebedor:* ${nome}\n`;
    mensagem += `*Valor:* R$ ${valor}\n\n`;
    mensagem += `\`\`\`${pixCode}\`\`\``;

    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
    window.open(url, '_blank');
}

document.addEventListener('DOMContentLoaded', carregarTudo);

document.getElementById('valor').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (!value) { e.target.value = ''; return; }
    e.target.value = (parseInt(value, 10) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
});
</script>

</body>
</html>
